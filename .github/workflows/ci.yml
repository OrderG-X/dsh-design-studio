# 日常检查：推送 / PR 时跑测试；外加每天一次在 macOS 和 Windows 上、最新版和预览版 DSH 里实装实跑（DSH 升级把插件弄坏时会在这里先红）。
# plugin.env 里写了 TEST_CMD_WINDOWS 的仓库，测试也在 Windows 上跑一遍；写了 E2E_CMD 的仓库，还会在 macOS / Windows / Linux 的真机上跑一遍端到端测试（比如浏览器桥连真 Chrome）。
# 模板在 dsh-plugins/_ci/，用 _ci/sync.sh 同步进五个仓库；每个仓库的差异只在 .github/plugin.env。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    outputs:
      e2e: ${{ steps.env.outputs.e2e }}
      wintest: ${{ steps.env.outputs.wintest }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Load plugin settings
        id: env
        run: |
          grep -vE '^\s*(#|$)' .github/plugin.env >> "$GITHUB_ENV"
          if grep -q '^E2E_CMD=.' .github/plugin.env; then echo e2e=true >> "$GITHUB_OUTPUT"; fi
          if grep -q '^TEST_CMD_WINDOWS=.' .github/plugin.env; then echo wintest=true >> "$GITHUB_OUTPUT"; fi
      - name: Test
        run: bash -ec "$TEST_CMD"
      - name: Pack
        working-directory: ${{ env.PKG_DIR }}
        run: npm pack --pack-destination "$RUNNER_TEMP" --silent
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/*.tgz
          retention-days: 7

  test-windows:
    needs: test
    if: needs.test.outputs.wintest == 'true'
    runs-on: windows-latest
    name: test · Windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Load plugin settings
        shell: bash
        run: grep -vE '^\s*(#|$)' .github/plugin.env >> "$GITHUB_ENV"
      - name: Test
        shell: bash
        run: bash -ec "$TEST_CMD_WINDOWS"

  dsh:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        dsh: [latest, next]
    name: ${{ matrix.os == 'windows-latest' && 'Windows' || 'macOS' }} · DSH ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Load plugin settings
        shell: bash
        run: grep -vE '^\s*(#|$)' .github/plugin.env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: .pkg
      # Windows 上现装 DSH（1.4 GB、9 万多个文件）要十几分钟：关掉实时扫描，再按「系统 + 实际装到的版本」缓存装好的 DSH 命令行。
      # DSH 出新版 → 版本号变了 → 缓存不中、现装新版；脚本自己也会核对版本，对不上就重装。插件本身每次现装。
      - name: Turn off Defender real-time scan
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Resolve DSH version
        id: dsh
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V=$(npm view "@deepseek-ai/dsh@${{ matrix.dsh }}" version --registry=https://registry.npmjs.org/ | tail -1 | tr -d "'\r") || V=
          echo "DSH ${{ matrix.dsh }} = ${V:-（没查到，不用缓存）}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Restore DSH from cache
        id: cache
        if: steps.dsh.outputs.version
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dsh-cli
          key: dsh-cli-${{ runner.os }}-${{ runner.arch }}-node24-${{ steps.dsh.outputs.version }}
      # plugin.env 的 PLATFORMS 之外的系统只作参考：失败会在摘要里标出来，但不让整次检查变红
      - name: Install and boot in a fresh DSH
        shell: bash
        continue-on-error: ${{ !contains(env.PLATFORMS, runner.os) }}
        run: node .github/dsh-compat.mjs .pkg/*.tgz --dsh ${{ matrix.dsh }} ${{ steps.dsh.outputs.version && '--cli-dir "$RUNNER_TEMP/dsh-cli"' || '' }}
      # 插件没过也存：DSH 本身装好了就值得留着
      - name: Save DSH to cache
        if: ${{ !cancelled() && steps.dsh.outputs.version && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dsh-cli
          key: dsh-cli-${{ runner.os }}-${{ runner.arch }}-node24-${{ steps.dsh.outputs.version }}

  e2e:
    needs: test
    if: needs.test.outputs.e2e == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    name: E2E · ${{ matrix.os == 'windows-latest' && 'Windows' || matrix.os == 'ubuntu-latest' && 'Linux' || 'macOS' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Load plugin settings
        shell: bash
        run: grep -vE '^\s*(#|$)' .github/plugin.env >> "$GITHUB_ENV"
      # 端到端里也要现装 DSH（9 万多个文件）：Windows 的 C 盘很慢（现装 10 分钟，D 盘 1 分半），临时目录挪到 D 盘的 RUNNER_TEMP
      - name: Turn off Defender real-time scan, temp dir on drive D
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          Set-MpPreference -DisableRealtimeMonitoring $true
      - name: End-to-end on a real machine
        shell: bash
        continue-on-error: ${{ !contains(env.PLATFORMS, runner.os) }}
        run: bash -ec "$E2E_CMD"
