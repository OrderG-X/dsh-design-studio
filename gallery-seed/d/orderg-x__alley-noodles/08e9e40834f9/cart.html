<html lang="zh">

<title>购物车 · 巷口面馆</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="cart-page">
<header class="mp-top paper">

  <div class="mp-nav"><a class="mp-back" href="menu.html" aria-label="返回点单"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1>购物车</h1></div>
</header>
<main class="mp-page">
  <div class="seg" role="tablist" aria-label="用餐方式">
    <button class="seg-item on" role="tab" aria-selected="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0z"/><path d="M9 20.5h6"/><path d="M12.5 3.5l-2.5 8M18.5 4l-4.5 7.5"/></svg><span><b>堂食</b><small>到店吃，叫号取面</small></span></button>
    <button class="seg-item" role="tab" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8.5h13l-1 12h-11z"/><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"/></svg><span><b>外带</b><small>打包 +¥1</small></span></button>
  </div>

  <section class="card items">
    <header class="card-head"><h2>已选 4 件</h2><button class="text-btn">清空</button></header>
    <div class="line">
      <div class="pic"><svg class="bowl" viewBox="0 0 80 80" aria-hidden="true"><path d="M31 21c-3.5-4 3-6.5-.5-11M40.5 18.5c-3.5-4 3-6.5-.5-11M50 21c-3.5-4 3-6.5-.5-11" fill="none" stroke="#C2A48B" stroke-width="2" stroke-linecap="round"/><path d="M9.5 39.5c1 16.5 13.5 27 30.5 27s29.5-10.5 30.5-27" fill="#FFF9F2" stroke="#2B1D14" stroke-width="2" stroke-linecap="round"/><path d="M16.5 52.5q2.9-2.7 5.8 0t5.8 0 5.8 0 5.8 0 5.8 0 5.8 0 5.8 0 5.8 0" fill="none" stroke="#A9542A" stroke-width="1.7" stroke-linecap="round"/><path d="M30 66.6c1.5 3 18.5 3 20 0" fill="none" stroke="#2B1D14" stroke-width="2" stroke-linecap="round"/><ellipse cx="40" cy="39.5" rx="31" ry="10" fill="#9C4A26" stroke="#2B1D14" stroke-width="2"/><path d="M17 41.5c3-2.4 6 2 9 0s6 2 9 0 6 2 9 0 6 2 9 0 6 2 9 0" fill="none" stroke="#F2D795" stroke-width="2.2" stroke-linecap="round"/><path d="M20 37.5c3-2.4 6 2 9 0s6 2 9 0 6 2 9 0 6 2 9 0" fill="none" stroke="#F2D795" stroke-width="2.2" stroke-linecap="round"/><path transform="translate(27 36) rotate(-8)" d="M-6 0c3.5-2.6 9-2.3 11.6.3C4 3.2-2.4 3.8-6 0z" fill="#6E3218" stroke="#2B1D14" stroke-width="1.2" stroke-linejoin="round"/><path transform="translate(38 33.5) rotate(6)" d="M-6 0c3.5-2.6 9-2.3 11.6.3C4 3.2-2.4 3.8-6 0z" fill="#6E3218" stroke="#2B1D14" stroke-width="1.2" stroke-linejoin="round"/><path transform="translate(33 42) rotate(2)" d="M-6 0c3.5-2.6 9-2.3 11.6.3C4 3.2-2.4 3.8-6 0z" fill="#6E3218" stroke="#2B1D14" stroke-width="1.2" stroke-linejoin="round"/><path d="M48 34c4-3.2 9.5-2.4 12 .8-3 2.6-8.6 2.8-12-.8z" fill="#7C9A5E" stroke="#2B1D14" stroke-width="1.2"/><path d="M49.5 34.2l9 .3" stroke="#E4EAD8" stroke-width="1.2" stroke-linecap="round"/><circle cx="46" cy="42" r="1.7" fill="#9DB97A" stroke="#4E6B3A" stroke-width=".8"/><circle cx="52" cy="40.5" r="1.7" fill="#9DB97A" stroke="#4E6B3A" stroke-width=".8"/><circle cx="24" cy="41.5" r="1.7" fill="#9DB97A" stroke="#4E6B3A" stroke-width=".8"/><circle cx="56" cy="43.5" r="1.7" fill="#9DB97A" stroke="#4E6B3A" stroke-width=".8"/><circle cx="42" cy="45" r="1.7" fill="#9DB97A" stroke="#4E6B3A" stroke-width=".8"/><circle cx="20" cy="38" r="1.1" fill="#E0763A"/><circle cx="58" cy="39" r="1.1" fill="#E0763A"/></svg></div>
      <div class="line-body">
        <h3>红烧牛肉面</h3>
        <p class="spec-txt">中碗 · 微辣 · 加煎蛋</p>
        <div class="line-foot"><span class="price"><small>¥</small>29</span><div class="stepper"><button class="step minus" aria-label="红烧牛肉面减一份"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 12h11"/></svg></i></button><span class="qty">1</span><button class="step plus" aria-label="红烧牛肉面加一份"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5v11M6.5 12h11"/></svg></i></button></div></div>
      </div>
    </div>
    <div class="opts">
      <p class="opt-label">辣度</p>
      <div class="opt-row"><button class="chip"><span>不辣</span></button><button class="chip on" aria-pressed="true"><span>微辣</span></button><button class="chip"><span>中辣</span></button><button class="chip"><span>特辣</span></button></div>
      <p class="opt-label">加料</p>
      <div class="opt-row"><button class="chip on" aria-pressed="true"><span>煎蛋 +3</span></button><button class="chip"><span>牛肉 +8</span></button><button class="chip"><span>青菜 +2</span></button><button class="chip"><span>加面 +2</span></button></div>
    </div>
    <hr class="dash">
    <div class="line">
      <div class="pic green"><svg class="bowl" viewBox="0 0 80 80" aria-hidden="true"><path d="M9.5 39.5c1 16.5 13.5 27 30.5 27s29.5-10.5 30.5-27" fill="#FFF9F2" stroke="#2B1D14" stroke-width="2" stroke-linecap="round"/><path d="M16.5 52.5q2.9-2.7 5.8 0t5.8 0 5.8 0 5.8 0 5.8 0 5.8 0 5.8 0 5.8 0" fill="none" stroke="#A9542A" stroke-width="1.7" stroke-linecap="round"/><path d="M30 66.6c1.5 3 18.5 3 20 0" fill="none" stroke="#2B1D14" stroke-width="2" stroke-linecap="round"/><ellipse cx="40" cy="39.5" rx="31" ry="10" fill="#E6BE72" stroke="#2B1D14" stroke-width="2"/><path d="M17 40c3-2.4 6 2 9 0s6 2 9 0 6 2 9 0 6 2 9 0 6 2 9 0M19 36c3-2.4 6 2 9 0s6 2 9 0 6 2 9 0 6 2 9 0M22 44c3-2.4 6 2 9 0s6 2 9 0 6 2 9 0 6 2 9 0" fill="none" stroke="#C99A4E" stroke-width="1.6" stroke-linecap="round"/><path d="M27 34.5l9 3.2M40 33.5l8.4 4.4M31 41l8 1.6M45 40.5l8-2.2" stroke="#3F5A2A" stroke-width="2.4" stroke-linecap="round"/><path d="M28 38.5c4 1 9 .6 13-1.2" fill="none" stroke="#8A4A22" stroke-width="1.6" stroke-linecap="round" opacity=".8"/></svg></div>
      <div class="line-body">
        <h3>葱油拌面</h3>
        <p class="spec-txt">标准份</p>
        <div class="line-foot"><span class="price"><small>¥</small>28</span><div class="stepper"><button class="step minus" aria-label="葱油拌面减一份"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 12h11"/></svg></i></button><span class="qty">2</span><button class="step plus" aria-label="葱油拌面加一份"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5v11M6.5 12h11"/></svg></i></button></div></div>
      </div>
    </div>
    <hr class="dash">
    <div class="line">
      <div class="pic green"><svg class="bowl" viewBox="0 0 80 80" aria-hidden="true"><ellipse cx="40" cy="47" rx="32" ry="13" fill="#FFF9F2" stroke="#2B1D14" stroke-width="2"/><ellipse cx="40" cy="45.5" rx="22" ry="7.5" fill="none" stroke="#A9542A" stroke-width="1.4" stroke-dasharray="2.5 3"/><g transform="translate(27 40) rotate(-12)"><rect x="-5" y="-3.4" width="10" height="6.8" rx="2.4" fill="#6F9150" stroke="#2B1D14" stroke-width="1.1"/><rect x="-3" y="-1.6" width="6" height="3.2" rx="1.4" fill="#DCE7C6"/></g><g transform="translate(37 37) rotate(8)"><rect x="-5" y="-3.4" width="10" height="6.8" rx="2.4" fill="#6F9150" stroke="#2B1D14" stroke-width="1.1"/><rect x="-3" y="-1.6" width="6" height="3.2" rx="1.4" fill="#DCE7C6"/></g><g transform="translate(47 40) rotate(-4)"><rect x="-5" y="-3.4" width="10" height="6.8" rx="2.4" fill="#6F9150" stroke="#2B1D14" stroke-width="1.1"/><rect x="-3" y="-1.6" width="6" height="3.2" rx="1.4" fill="#DCE7C6"/></g><g transform="translate(33 46) rotate(14)"><rect x="-5" y="-3.4" width="10" height="6.8" rx="2.4" fill="#6F9150" stroke="#2B1D14" stroke-width="1.1"/><rect x="-3" y="-1.6" width="6" height="3.2" rx="1.4" fill="#DCE7C6"/></g><g transform="translate(44 46) rotate(-10)"><rect x="-5" y="-3.4" width="10" height="6.8" rx="2.4" fill="#6F9150" stroke="#2B1D14" stroke-width="1.1"/><rect x="-3" y="-1.6" width="6" height="3.2" rx="1.4" fill="#DCE7C6"/></g><g transform="translate(53 44) rotate(6)"><rect x="-5" y="-3.4" width="10" height="6.8" rx="2.4" fill="#6F9150" stroke="#2B1D14" stroke-width="1.1"/><rect x="-3" y="-1.6" width="6" height="3.2" rx="1.4" fill="#DCE7C6"/></g><circle cx="31" cy="42.5" r="1.2" fill="#D9452B"/><circle cx="50" cy="38.5" r="1.2" fill="#D9452B"/><circle cx="42" cy="42" r="1.1" fill="#FFFDF7" stroke="#2B1D14" stroke-width=".6"/></svg></div>
      <div class="line-body">
        <h3>凉拌黄瓜</h3>
        <p class="spec-txt">蒜香 · 微辣</p>
        <div class="line-foot"><span class="price"><small>¥</small>8</span><div class="stepper"><button class="step minus" aria-label="凉拌黄瓜减一份"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 12h11"/></svg></i></button><span class="qty">1</span><button class="step plus" aria-label="凉拌黄瓜加一份"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5v11M6.5 12h11"/></svg></i></button></div></div>
      </div>
    </div>
  </section>

  <section class="card">
    <header class="card-head"><h2>口味备注</h2><span class="muted small">给煮面师傅看</span></header>
    <div class="quick"><button class="chip on" aria-pressed="true"><span>不要香菜</span></button><button class="chip on" aria-pressed="true"><span>汤多一点</span></button><button class="chip"><span>面硬一点</span></button><button class="chip"><span>不要葱</span></button></div>
    <div class="note"><p>面煮软一点，谢谢老板</p><span class="num">10/50</span></div>
  </section>

  <section class="card sum">
    <p><span>商品小计</span><span class="num">¥65</span></p>
    <p><span><svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5V4.5h8l9 9-8 8z"/><circle cx="8" cy="9" r="1.4"/></svg>满 60 减 5</span><span class="num minus">−¥5</span></p>
    <p><span>打包费</span><span class="muted">堂食不收</span></p>
  </section>
</main>

<div class="mp-actionbar">
  <div class="total"><p>合计 <b class="num">¥60</b></p><small>已优惠 ¥5</small></div>
  <a class="btn-primary go" href="order.html">去结算</a>
</div>

<style>
.cart-page .mp-page { padding-top: 8px; padding-bottom: 132px; }
.small { font-size: var(--text-sm); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: var(--radius-lg); background: var(--color-paper); margin-bottom: 12px; }
.seg-item { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 12px; border-radius: 14px; color: var(--color-muted); text-align: left; }
.seg-item b { display: block; font-family: var(--font-serif); font-size: var(--text-body); color: var(--color-text); line-height: 1.3; }
.seg-item small { display: block; font-size: var(--text-xs); line-height: 1.3; }
.seg-item.on { background: var(--color-surface); color: var(--color-primary); box-shadow: var(--shadow-sm); }
.seg-item.on small { color: var(--color-muted); }

.text-btn { height: 44px; min-width: 44px; padding: 0 2px 0 12px; margin: -10px -2px -10px 0; font-size: var(--text-md); color: var(--color-muted); }
.line { display: flex; gap: 12px; }
.line .pic { width: 68px; height: 68px; }
.line .bowl { width: 62px; height: 62px; }
.line-body { flex: 1; min-width: 0; }
.line-body h3 { font-family: var(--font-serif); font-size: var(--text-body); font-weight: 700; line-height: 1.35; }
.spec-txt { font-size: var(--text-sm); color: var(--color-muted); }
.line-foot { display: flex; align-items: center; justify-content: space-between; height: 40px; margin-top: 2px; }
.line-foot .price { font-size: var(--text-lg); }

.opts { margin-top: 10px; padding: 8px 12px 4px; border-radius: 12px; background: var(--color-bg); }
.opt-label { font-size: var(--text-sm); color: var(--color-muted); margin-top: 2px; }
.opt-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip { height: 44px; display: grid; place-items: stretch; align-content: center; }
.chip > span { display: grid; place-items: center; height: 32px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--color-line); background: var(--color-surface); font-size: var(--text-sm); color: var(--color-text); white-space: nowrap; }
.chip.on > span { border-color: var(--color-primary); background: var(--color-primary-soft); color: var(--color-primary-deep); font-weight: 600; }

.quick { display: flex; flex-wrap: wrap; gap: 0 8px; }
.quick .chip > span { padding: 0 12px; border-radius: var(--radius-full); }
.note { position: relative; margin-top: 8px; min-height: 72px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--color-line); background: var(--color-bg); font-size: var(--text-md); }
.note span { position: absolute; right: 12px; bottom: 8px; font-size: var(--text-xs); color: var(--color-muted); }

.sum p { display: flex; align-items: center; justify-content: space-between; font-size: var(--text-md); line-height: 2; }
.sum p > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.sum .ico { color: var(--color-primary); }
.sum .minus { color: var(--color-primary-deep); font-weight: 600; }

.total { flex: 1; }
.total p { font-size: var(--text-md); }
.total b { font-size: var(--text-xl); color: var(--color-primary); }
.total small { display: block; font-size: var(--text-sm); color: var(--color-muted); line-height: 1.2; }
.go { min-width: 148px; }
</style>
</body>
</html>
