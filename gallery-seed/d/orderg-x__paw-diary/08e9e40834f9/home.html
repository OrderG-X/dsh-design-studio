<head>
<meta charset="utf-8">

<title>首页 · 毛孩日记</title>
<link rel="stylesheet" href="tokens.css">

<style>
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding-top: var(--space-1); }
  .pets { display: flex; align-items: center; gap: var(--space-2); }
  .pet { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: 4px 6px 4px 4px; border-radius: var(--radius-pill); font-weight: 700; color: var(--muted); }
  .pet .avatar { width: 36px; height: 36px; box-shadow: none; }
  .pet.on { padding-right: 16px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .pet.add { width: 44px; justify-content: center; padding: 0; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); color: var(--link); }
  .pet.add .ico { width: 20px; height: 20px; stroke-width: 2.6; }
  .round-btn { position: relative; flex: 0 0 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm); }
  .round-btn .dot { position: absolute; top: 10px; right: 11px; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px var(--surface); }

  .hero { position: relative; margin-top: var(--space-4); padding: var(--space-5) 140px var(--space-5) var(--space-5); border-radius: 28px; background: var(--primary); color: var(--on); box-shadow: var(--shadow-primary); overflow: hidden; }
  .hero .kind { font-size: var(--fs-meta); font-weight: 700; }
  .hero h1 { font-size: var(--fs-num); line-height: 1.15; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .hero h1 .ico { width: 20px; height: 20px; color: var(--surface); }
  .hero p { margin-top: var(--space-1); font-size: var(--fs-meta); font-weight: 600; }
  .hero-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-4); }
  .hero .chip { background: var(--surface); }
  .hero-pet { position: absolute; right: -4px; bottom: -8px; width: 150px; height: 150px; }

  .todo-card { margin-top: var(--space-5); padding: var(--space-4) var(--space-3) var(--space-2); }
  .todo-head { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-1) var(--space-2) var(--space-2); }
  .todo-head h2 { font-size: var(--fs-h3); }
  .todos { list-style: none; margin: 0; padding: 0; }
  .todo { display: flex; align-items: center; gap: var(--space-3); padding: 6px var(--space-1) 6px var(--space-2); }
  .todo + .todo { border-top: 2px dashed var(--line); }
  .todo .tile { width: 40px; height: 40px; border-radius: 13px; }
  .todo .tile .ico { width: 22px; height: 22px; }
  .todo-txt { flex: 1; min-width: 0; line-height: 1.4; }
  .todo-txt b { display: block; font-weight: 700; }
  .todo.done .todo-txt b { color: var(--muted); }
  .check { flex: 0 0 44px; height: 44px; display: grid; place-items: center; }
  .check span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2.5px var(--line); color: var(--surface); }
  .check .ico { width: 16px; height: 16px; stroke-width: 3.2; }
  .done .check span { background: var(--primary); box-shadow: none; color: var(--text); }
  .todo.warn { margin: 6px 0 4px; padding: var(--space-2) var(--space-3) var(--space-2) var(--space-2); border: 0; border-radius: var(--radius-md); background: var(--yellow-soft); }
  .todo.warn .tile { background: var(--accent); color: var(--text); }
  .todo.warn .chip { margin-right: 2px; }

  .weight { margin-top: var(--space-4); display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4); }
  .weight-txt { flex: 0 0 auto; line-height: 1.3; }
  .weight-txt .val { display: flex; align-items: baseline; gap: 3px; margin-top: 2px; }
  .num { font-size: var(--fs-h2); font-weight: var(--w-head); letter-spacing: -.02em; }
  .spark { flex: 1; min-width: 0; height: 44px; }
  .weight .chip { align-self: center; }
  .weight > .ico { flex: 0 0 auto; width: 20px; height: 20px; color: var(--muted); stroke-width: 2.6; }

  .book { position: relative; margin-top: var(--space-4); display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-4) var(--space-4) var(--space-5); border-radius: var(--radius); background: var(--accent); box-shadow: var(--shadow-accent); overflow: hidden; }
  .book-txt { flex: 1; min-width: 0; }
  .book-txt b { display: block; font-size: var(--fs-h3); font-weight: var(--w-head); }
  .book-txt .meta { color: var(--text); }
  .book .go { flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-pill); background: var(--surface); font-weight: 700; box-shadow: 0 4px 0 var(--yellow-deep); }
  .book-art { flex: 0 0 64px; height: 56px; }
</style>
</head>
