<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dsh-design" content="slides">
<title>封面 · 青禾年度回顾</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="deck.css">
<style>
  .left {
    position: absolute;
    top: var(--margin);
    left: var(--margin);
    width: 662px;
    height: 592px;
    border-top: var(--rule) solid var(--color-line);
  }
  .labels { padding-top: 12px; grid-template-columns: repeat(7, var(--col)); font-size: var(--text-note); line-height: 20px; }
  .labels .a { grid-column: 1 / 4; font-weight: 700; }
  .labels .b { grid-column: 4 / 8; }

  .mark {
    position: absolute;
    top: 96px;
    left: 0;
    width: 74px;
    height: 74px;
    background: var(--color-text);
    color: var(--color-bg);
    font-size: var(--text-sub);
    font-weight: 700;
    line-height: 74px;
    padding-left: 12px;
  }
  .hero {
    position: absolute;
    top: 216px;
    left: -6px;
    font-size: var(--text-hero);
    font-weight: var(--weight-head);
    line-height: 1;
    letter-spacing: -0.04em;
  }
  .sub {
    position: absolute;
    top: 376px;
    left: 0;
    font-size: var(--text-sub);
    line-height: 1.3;
  }
  .meta {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 662px;
    grid-template-columns: repeat(7, var(--col));
  }
  .meta div { border-top: var(--rule-thin) solid var(--color-line); padding-top: 12px; }
  .meta .m1 { grid-column: 1 / 3; }
  .meta .m2 { grid-column: 3 / 5; }
  .meta .m3 { grid-column: 5 / 8; }
  .meta dt { font-size: var(--text-note); color: var(--color-muted); line-height: 20px; }
  .meta dd { font-size: var(--text-body); font-weight: 700; line-height: 1.3; margin-top: 4px; }

  .block {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 726px;
    background: var(--color-primary);
    color: var(--color-on-primary);
  }
  .block .row {
    position: absolute;
    top: var(--margin);
    left: 24px;
    width: 466px;
    padding-top: 20px;
    grid-template-columns: repeat(5, var(--col));
    font-size: var(--text-note);
    line-height: 20px;
  }
  .block .row .a { grid-column: 1 / 4; font-weight: 700; }
  .block .row .pg { grid-column: 5 / 6; }
  .block .year {
    position: absolute;
    left: 14px;
    bottom: 44px;
    font-size: 188px;
    font-weight: var(--weight-head);
    line-height: 1;
    letter-spacing: -0.05em;
  }
  .block .cap {
    position: absolute;
    left: 24px;
    bottom: 252px;
    font-size: var(--text-small);
    line-height: 1.4;
    font-weight: 700;
  }
</style>
</head>
<body>
<main class="slide">
  <section class="left">
    <div class="labels grid">
      <span class="a">青禾植物</span>
      <span class="b">2026 年度经营汇报 · 内部资料</span>
    </div>
    <div class="mark" aria-hidden="true">禾</div>
    <h1 class="hero">年度回顾</h1>
    <p class="sub">从 3 家店到 7 家，<br>营收 1,860 万元</p>
    <dl class="meta grid">
      <div class="m1"><dt>汇报人</dt><dd>林晓舟</dd></div>
      <div class="m2"><dt>日期</dt><dd>2027.01.08</dd></div>
      <div class="m3"><dt>场合</dt><dd>青禾全员年会</dd></div>
    </dl>
  </section>

  <aside class="block">
    <div class="row grid">
      <span class="a">Annual Review</span>
      <a class="pg" href="02-highlights.html">01 / 06</a>
    </div>
    <p class="cap">城市里的<br>一小片绿</p>
    <p class="year num">2026</p>
  </aside>
</main>
</body>
</html>
