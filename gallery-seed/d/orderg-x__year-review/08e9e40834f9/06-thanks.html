<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dsh-design" content="slides">
<title>谢谢 · 青禾年度回顾</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="deck.css">
<style>
  body { background: var(--color-primary); color: var(--color-on-primary); }
  .top { border-top-color: var(--color-on-primary); }
  .top .pg:hover { color: var(--color-on-primary); text-decoration: underline; }
  .hero {
    position: absolute;
    top: 160px;
    left: 56px;
    font-size: 200px;
    font-weight: var(--weight-head);
    line-height: 1;
    letter-spacing: -0.05em;
  }
  .sub {
    position: absolute;
    top: 392px;
    left: var(--margin);
    font-size: var(--text-sub);
    line-height: 1.3;
  }
  .info {
    position: absolute;
    left: var(--margin);
    bottom: var(--margin);
    width: 1152px;
  }
  .info div { grid-column: span 4; border-top: var(--rule-thin) solid var(--color-on-primary); padding-top: 12px; }
  .info dt { font-size: var(--text-note); line-height: 20px; }
  .info dt b { display: inline-block; width: 40px; }
  .info dd { margin-top: 8px; font-size: var(--text-body); font-weight: 700; line-height: 1.35; }
</style>
</head>
<body>
<main class="slide">
  <header class="top grid">
    <span class="brand">青禾植物</span>
    <span class="deck">2026 年度回顾</span>
    <span class="sec">05 — 问答</span>
    <a class="pg" href="01-cover.html">06 / 06</a>
  </header>

  <h1 class="hero">谢谢大家</h1>
  <p class="sub">接下来 15 分钟，欢迎提问。</p>

  <dl class="info grid">
    <div><dt><b>01</b>下一场</dt><dd>14:30 滨江店长分享<br>开店第一年怎么打平</dd></div>
    <div><dt><b>02</b>会后资料</dt><dd>年会群文件<br>「2026 年度回顾」</dd></div>
    <div><dt><b>03</b>茶歇</dt><dd>3 楼花房，<br>每人可带走一盆绿萝</dd></div>
  </dl>
</main>
</body>
</html>
