                  <svg viewBox="0 0 196 36" aria-hidden="true"><defs><linearGradient id="bl" x1="0" x2="1"><stop offset="0" stop-color="#F6DA6B"/><stop offset="1" stop-color="#EE9B3B"/></linearGradient></defs><circle cx="18" cy="18" r="14" fill="#F6DA6B"/><path d="M40 18h10" stroke="#56665A" stroke-width="2" stroke-linecap="round"/><path d="M46 13l5 5-5 5" stroke="#56665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="74" cy="18" r="14" fill="#EE9B3B"/><path d="M96 18h10" stroke="#56665A" stroke-width="2" stroke-linecap="round"/><path d="M102 13l5 5-5 5" stroke="#56665A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="4" width="76" height="28" rx="14" fill="url(#bl)"/></svg>
                </div>
                <p class="tip"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>纸还亮亮的时候点最好看</p>
                <button class="listen" type="button"><i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></i><span>听老师讲</span><span class="wave" aria-hidden="true"><b style="height:8px"></b><b style="height:14px"></b><b style="height:10px"></b><b style="height:18px"></b><b style="height:12px"></b><b style="height:16px"></b><b style="height:8px"></b><b style="height:12px"></b><b style="height:6px"></b><b style="height:10px"></b></span><time>0:24</time></button>
              </div>
            </li>
          </ol>
        </section>

        <section class="card palette" aria-label="颜色盘">
          <div class="card-h"><h2>颜色盘</h2><span class="legend"><i></i>这一课推荐</span></div>
          <div class="sw-grid">
            <button class="sw" type="button"><i style="background:#F6DA6B"></i><span class="rec" aria-label="推荐"></span>柠檬黄</button>
            <button class="sw on" type="button" aria-pressed="true"><i style="background:#EE9B3B"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></i><span class="rec" aria-label="推荐"></span>橘黄</button>
            <button class="sw" type="button"><i style="background:#C9962A"></i>土黄</button>
            <button class="sw" type="button"><i style="background:#9A6B44"></i><span class="rec" aria-label="推荐"></span>赭石</button>
            <button class="sw" type="button"><i style="background:#A9D3A6"></i>嫩绿</button>
            <button class="sw" type="button"><i style="background:#4E9A5F"></i>草绿</button>
            <button class="sw" type="button"><i style="background:#8EC5E0"></i>天蓝</button>
            <button class="sw" type="button"><i style="background:#5C7FB8"></i>群青</button>
          </div>
          <div class="water">
            <span class="water-k"><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c3.2 4.1 5.8 7.2 5.8 10.2a5.8 5.8 0 0 1-11.6 0c0-3 2.6-6.1 5.8-10.2z"/></svg>笔上的水</span>
            <span class="drops">
              <button type="button" aria-label="水少"><i style="width:10px;height:10px"></i></button>
              <button class="on" type="button" aria-label="水适中" aria-pressed="true"><i></i></button>
              <button type="button" aria-label="水多"><i style="width:18px;height:18px"></i></button>
            </span>
          </div>
        </section>

        <div class="finish">
          <a class="btn btn-primary" href="courses.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>我画好了</a>
          <p><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19.5C4.6 11 9.5 5.2 19.8 4.2 20.2 14 14.6 19.6 5 19.5z" fill="#C9962A" stroke="none"/><path d="M5.5 19 13 11.5" stroke="#FFF7DF" stroke-width="1.8" stroke-linecap="round"/></svg>画完能收到 3 片小叶子</p>
        </div>
      </aside>
    </div>
  </div>
</body>
</html>
