<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="dsh-design" content="diagram 1600x900">
<title>产品路线图 · 落笔 AI 写作</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="diagram.css">
</head>
<body class="dg-page">
<main class="dg-canvas">
  <header class="dg-head">
    <span class="dg-kicker">2026 产品路线图</span>
    <h1>落笔 AI 写作：从写得快到写得好</h1>
  </header>
  <div class="dg rm" style="--cols: 4">
    <div class="rm-head"><span>Q1 · 1–3 月</span><span>Q2 · 4–6 月</span><span>Q3 · 7–9 月</span><span>Q4 · 10–12 月</span></div>
    <section class="rm-lane">
      <h3 class="rm-name">编辑器<small>核心体验</small></h3>
      <div class="rm-track">
        <div class="rm-bar done" style="--from: 1; --span: 2">块编辑器重写<small>打开速度 2.1s → 0.6s</small></div>
        <div class="rm-bar" style="--from: 3">离线写作</div>
        <div class="rm-bar plan" style="--from: 4">手写笔支持</div>
        <div class="rm-ms" style="--at: 2">v3.0 发布</div>
      </div>
    </section>
    <section class="rm-lane">
      <h3 class="rm-name">AI 能力</h3>
      <div class="rm-track">
        <div class="rm-bar done" style="--from: 1">续写与改写</div>
        <div class="rm-bar" style="--from: 2; --span: 2">全文风格统一<small>按品牌语气改全文</small></div>
        <div class="rm-bar plan" style="--from: 3; --span: 2">资料库问答</div>
      </div>
    </section>
    <section class="rm-lane">
      <h3 class="rm-name">协作</h3>
      <div class="rm-track">
        <div class="rm-bar" style="--from: 2">多人批注</div>
        <div class="rm-bar" style="--from: 3; --span: 2">团队空间与权限</div>
        <div class="rm-ms" style="--at: 4" >企业版上线</div>
      </div>
    </section>
    <section class="rm-lane">
      <h3 class="rm-name">商业化</h3>
      <div class="rm-track">
        <div class="rm-bar done" style="--from: 1">个人会员改版</div>
        <div class="rm-bar plan" style="--from: 4">海外支付</div>
      </div>
    </section>
    <div class="rm-now" style="--at: 2.45"><span>今天</span></div>
  </div>
  <footer class="dg-foot">
    <ul class="dg-legend"><li>进行中</li><li class="plan">规划中，未排期</li></ul>
    <p class="dg-note">更新于 2026 年 5 月 · 以季度为单位，具体日期见各项目排期表</p>
  </footer>
</main>
</body>
</html>
